# values.yaml — Default configuration for the invokeai-omni Helm chart.
# Override any value at install time with --set or a custom values file.

# ---------------------------------------------------------------------------
# InvokeAI — the canvas / workflow engine + bridge plugin
# ---------------------------------------------------------------------------
invokeai:
  image:
    repository: ghcr.io/redhat-et/invokeai-vllm-omni-bridge
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  resources:
    requests:
      memory: "8Gi"
      cpu: "2"
    limits:
      memory: "16Gi"
      cpu: "4"

  # Environment variables passed to the InvokeAI container.
  # Leave vllmBaseUrl and vllmImageBaseUrl empty to auto-derive from ISVC names
  # and KServe predictor naming convention. Override to point at an external endpoint.
  env:
    vllmBaseUrl: ""
    vllmImageBaseUrl: ""
    vllmApiKey: "EMPTY"
    vllmTimeout: "120"

# ---------------------------------------------------------------------------
# KServe — predictor naming convention (depends on serving mode)
# ---------------------------------------------------------------------------
kserve:
  # RawDeployment mode (no Knative): suffix "-predictor", port 8000
  # Serverless mode (Knative):       suffix "-predictor-default", port 8000
  predictorSuffix: "-predictor"
  predictorPort: 8000

# ---------------------------------------------------------------------------
# ServingRuntime — tells KServe how to launch a vLLM container
# ---------------------------------------------------------------------------
servingRuntime:
  # Set to false if a suitable ServingRuntime already exists in the namespace.
  create: true
  # Must match vllmOmni.runtime below.
  name: "vllm-multimodal"
  # Must match vllmImageGen.runtime below (diffusion models need --omni entrypoint).
  diffusionName: "vllm-diffusion"
  image:
    # vLLM-Omni image — shared by both runtimes (transformer + diffusion).
    # NOT plain vLLM; RHOAI's vLLM (registry.redhat.io/rhaii/vllm-cuda-rhel9)
    # doesn't support vLLM-Omni's multi-stage pipeline or diffusion.
    repository: docker.io/vllm/vllm-omni
    tag: "v0.22.0"

# ---------------------------------------------------------------------------
# OpenShift Route — expose InvokeAI externally
# ---------------------------------------------------------------------------
route:
  # Set to false on non-OpenShift clusters or if using Ingress instead.
  create: true
  # Leave empty to auto-generate from the cluster's apps domain.
  host: ""
  tls:
    termination: edge

# ---------------------------------------------------------------------------
# vLLM-Omni — multimodal inference backend (deployed as a KServe ISVC)
# ---------------------------------------------------------------------------
vllmOmni:
  # HuggingFace model identifier or URI understood by the KServe storage initializer.
  modelUri: "hf://Qwen/Qwen2.5-Omni-7B"

  # Must match servingRuntime.name above.
  runtime: "vllm-multimodal"

  resources:
    requests:
      nvidia.com/gpu: "1"
      memory: "24Gi"
      cpu: "4"
    limits:
      nvidia.com/gpu: "1"
      memory: "32Gi"
      cpu: "8"

  # Extra vLLM engine arguments passed via the ISVC args field.
  # vLLM-Omni uses a multi-stage engine; the global --gpu-memory-utilization and
  # --max-model-len flags do NOT propagate to individual stage engines (stage 0
  # defaults to 0.8 utilization and will OOM on a shared GPU without overrides).
  # Use --stage-overrides to configure per-stage memory instead:
  # - "--stage-overrides={\"0\": {\"gpu_memory_utilization\": 0.65, \"max_model_len\": 16384}}"
  extraArgs: []

# ---------------------------------------------------------------------------
# vLLM-Omni Image Generation — diffusion model backend (deployed as a KServe ISVC)
# ---------------------------------------------------------------------------
vllmImageGen:
  # HuggingFace model identifier for the image generation model.
  # FLUX.2-klein-4B is the smallest Flux variant (~8 GB weights, broadest hardware support).
  modelUri: "hf://black-forest-labs/FLUX.2-klein-4B"

  # Must match servingRuntime.diffusionName above (diffusion models need --omni entrypoint).
  runtime: "vllm-diffusion"

  resources:
    requests:
      nvidia.com/gpu: "1"
      memory: "16Gi"
      cpu: "2"
    limits:
      nvidia.com/gpu: "1"
      memory: "24Gi"
      cpu: "4"

  # Extra vLLM engine arguments. Flux is a single-stage diffusion model —
  # no multi-stage pipeline, so --stage-overrides is not needed.
  extraArgs: []
